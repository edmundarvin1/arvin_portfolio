<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading P&L Dashboard - Arvin De Leon</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="../../index.html" class="logo-link"><div class="logo">Arvin De Leon</div></a>
        <nav>
            <ul>
                <li><a href="../../projects.html">Projects</a></li>
            </ul>
        </nav>
    </header>

    <main class="dashboard-page">
        <div class="dashboard-container">
            <h1>Trading P&L Dashboard</h1>
            <p>Live algorithm performance tracking</p>

            <div id="loading">Loading data...</div>
            <div id="error" style="display: none; color: red;"></div>

            <!-- Dashboard content will be inserted here by JavaScript -->
            <div id="dashboard-content" style="display: none;">
                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>Total P&L</h3>
                        <p id="total-pnl">$0.00</p>
                    </div>
                    <div class="metric-card">
                        <h3>Win Rate</h3>
                        <p id="win-rate">0%</p>
                    </div>
                    <div class="metric-card">
                        <h3>Total Trades</h3>
                        <p id="total-trades">0</p>
                    </div>
                    <div class="metric-card">
                        <h3>Sharpe Ratio</h3>
                        <p id="sharpe-ratio">0.00</p>
                    </div>
                </div>

                <div class="chart-container">
                    <h2>P&L Over Time</h2>
                    <canvas id="pnl-chart"></canvas>
                </div>

                <div class="trades-table">
                    <h2>Recent Trades</h2>
                    <table id="trades-list">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Pair</th>
                                <th>Type</th>
                                <th>P&L</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
